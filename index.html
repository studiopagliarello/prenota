<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prenotazione visita dermatologica</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1d2733; --muted:#5d6b7a; --line:#dde3ea;
  --accent:#1f6f8b; --accent-ink:#ffffff; --accent-soft:#e3f0f5; --warn:#b4471f; --warn-soft:#fbeee8;
  --ok:#2e7d4f; --ok-soft:#e6f4ec; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11161c; --card:#1a222b; --ink:#e7edf3; --muted:#9aa8b6; --line:#2c3743;
    --accent:#5fb3d0; --accent-ink:#0b1a20; --accent-soft:#1c3440; --warn:#f0a07e; --warn-soft:#3a2219;
    --ok:#7fd1a1; --ok-soft:#173225;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
header{padding:8px 2px 12px}
header .studio{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
header h1{font-size:22px;line-height:1.25;margin:2px 0 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 16px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px}
.sez{font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.descr{color:var(--ink);white-space:pre-line;margin:0 0 14px}
.descr.box{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
h2{font-size:19px;line-height:1.3;margin:0 0 6px}
.aiuto{color:var(--muted);font-size:15px;margin:0 0 12px;white-space:pre-line}
.obbl{color:var(--warn);font-weight:700}
.opz{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);
  border-radius:12px;padding:14px 14px;margin:8px 0;font:inherit;cursor:pointer;min-height:52px}
.opz:active{transform:scale(.99)}
.opz.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opz .tick{float:right;color:var(--accent);font-weight:700;margin-left:10px}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:120px;resize:vertical}
.err{color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.griglia{width:100%;border-collapse:separate;border-spacing:0 8px}
.griglia th{font-size:14px;color:var(--muted);font-weight:600;text-align:center;padding:0 4px}
.griglia td{padding:0 4px}
.griglia td:first-child{font-weight:600;padding-left:0}
.chip{width:100%;min-height:46px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;font:inherit;font-size:15px;cursor:pointer}
.chip.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;font:inherit;font-weight:600;border-radius:12px;padding:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:2}
.btn[disabled]{opacity:.5}
.riep dt{color:var(--muted);font-size:14px;margin-top:12px}
.riep dd{margin:2px 0 0;font-weight:600;white-space:pre-line}
.riep a{font-weight:400;font-size:14px;color:var(--accent);margin-left:6px}
.fatto{background:var(--ok-soft);border-color:transparent;text-align:center}
.fatto .ico{font-size:40px;color:var(--ok)}
.piede{color:var(--muted);font-size:14px;text-align:center;margin-top:18px}
.piede a,.descr a,.aiuto a{color:var(--accent)}
.trappola{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.carico{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="studio">Dott. Calogero Pagliarello · Dermatologo</div>
    <h1 id="titolo">Prenotazione visita dermatologica</h1>
  </header>
  <div class="bar"><i id="barra"></i></div>
  <main id="main"><div class="carico">Caricamento…</div></main>
  <div class="trappola" aria-hidden="true"><label>Sito <input id="sito" type="text" tabindex="-1" autocomplete="off"></label></div>
  <p class="piede" id="piede"></p>
</div>
<nav class="nav" id="nav" hidden>
  <div class="in">
    <button class="btn" id="indietro" type="button">Indietro</button>
    <button class="btn pri" id="avanti" type="button">Avanti</button>
  </div>
</nav>

<script>
// Indirizzo dello «sportello» Apps Script (link /exec del deployment). Da cambiare solo se si rifà il deployment.
const API = 'https://script.google.com/macros/s/AKfycbwYP--O1pukvvEgKrlq5JYl-TisJLAuv-3iMopVX-Y4--Ji7q92dtoBr4qCZHB8tT_bSQ/exec';
const MODULO_RISERVA = 'https://docs.google.com/forms/d/e/1FAIpQLSdawhisZXfgekKljdzbstleeZc7mLEd2Kbo7s3GrT_oJiMiuw/viewform';

let S = null;            // struttura del modulo
let risposte = {};       // id domanda -> valore
let storia = [];         // percorso: [{p, q}] (p = indice pagina, q = indice domanda, -1 = pagina senza domande)
let modo = 'domanda';    // 'domanda' | 'riepilogo' | 'fatto'
let inizio = Date.now();
let ultimaPersona = '';
let inAttesa = false;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g, '<a href="mailto:$1">$1</a>');

// ---------- caricamento ----------
async function carica() {
  try {
    const r = await fetch(API, { credentials: 'omit' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.errore || 'errore');
    S = j.struttura;
    // Toglie dalla descrizione la riga che rimanda a questa pagina.
    S.pagine[0].descr = (S.pagine[0].descr || '').split('\n').filter(l => l.indexOf('github.io') < 0).join('\n').replace(/^\n+/, '');
    $('piede').innerHTML = 'Problemi con questa pagina? Usa il <a href="' + MODULO_RISERVA + '" target="_blank" rel="noopener">modulo Google</a>.';
    nuovaScheda();
  } catch (e) {
    $('main').innerHTML = '<div class="card"><h2>La pagina non si è caricata</h2><p class="aiuto">Controlla la connessione e riprova, oppure usa il modulo Google.</p>' +
      '<a class="opz" href="' + MODULO_RISERVA + '">Apri il modulo Google</a><button class="opz" onclick="location.reload()">Riprova</button></div>';
  }
}

function nuovaScheda() {
  storia = [{ p: 0, q: S.pagine[0].domande.length ? 0 : -1 }];
  modo = 'domanda';
  inizio = Date.now();
  mostra();
}

// ---------- percorso ----------
const cur = () => storia[storia.length - 1];
const domandaDi = st => st.q >= 0 ? S.pagine[st.p].domande[st.q] : null;
const indicePagina = id => S.pagine.findIndex(p => p.id === id);

function paginaDopo(p) {
  const pag = S.pagine[p];
  let dest = null;
  pag.domande.forEach(d => {                               // l'ultima scelta con salto della pagina decide
    if (d.tipo !== 'scelta') return;
    const c = (d.scelte || []).find(c => c.v === risposte[d.id]);
    if (c && c.nav) dest = c.nav;
  });
  if (!dest) dest = pag.dopo || 'successiva';
  if (dest === 'invia') return -1;
  if (dest === 'inizio') return 0;
  if (dest === 'successiva') return p + 1 < S.pagine.length ? p + 1 : -1;
  const i = indicePagina(dest);
  return i >= 0 ? i : -1;
}

function avanti() {
  const st = cur();
  const d = domandaDi(st);
  if (d) {
    const e = errore(d);
    if (e) { mostraErrore(e); return; }
  }
  const pag = S.pagine[st.p];
  if (st.q >= 0 && st.q + 1 < pag.domande.length) { storia.push({ p: st.p, q: st.q + 1 }); return mostra(); }
  const np = paginaDopo(st.p);
  if (np < 0) { modo = 'riepilogo'; return mostra(); }
  storia.push({ p: np, q: S.pagine[np].domande.length ? 0 : -1 });
  mostra();
}

function indietro() {
  if (modo === 'riepilogo') { modo = 'domanda'; return mostra(); }
  if (storia.length > 1) { storia.pop(); mostra(); }
}

// ---------- controlli ----------
const isTel = d => /^telefono/i.test(d.titolo);
const isEmail = d => /^e-?mail/i.test(d.titolo);
const isAnno = d => /in che anno/i.test(d.titolo);

function vuota(d) {
  const v = risposte[d.id];
  if (d.tipo === 'griglia') return !v || !Object.values(v).some(a => a && a.length);
  if (Array.isArray(v)) return !v.length;
  return v === undefined || v === null || String(v).trim() === '';
}

function errore(d) {
  if (d.tipo === 'info' || d.tipo === 'non_gestito') return '';
  if (vuota(d)) return d.obbl ? (d.tipo === 'spunte' && d.scelte.length === 1 ? 'Per continuare devi spuntare la casella.' : 'Questa risposta è obbligatoria.') : '';
  const v = String(risposte[d.id]).trim();
  if (isTel(d)) {
    const cifre = v.replace(/\D/g, '');
    if (!/^\+?[\d\s]+$/.test(v) || cifre.length < 9 || cifre.length > 13) return 'Controlla il numero di telefono: servono almeno 9 cifre.';
  }
  if (isEmail(d) && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Controlla l\'indirizzo email.';
  if (isAnno(d)) {
    const a = Number(v), max = new Date().getFullYear();
    if (!/^\d{4}$/.test(v) || a < 1995 || a > max) return 'Scrivi l\'anno con quattro cifre (per esempio ' + (max - 1) + ').';
  }
  if (d.tipo === 'scelta' && risposte[d.id] === '__altro__') return 'Scrivi la tua risposta.';
  return '';
}

function mostraErrore(msg) {
  let el = document.querySelector('.err');
  if (!el) { el = document.createElement('div'); el.className = 'err'; document.querySelector('#main .card:last-child').appendChild(el); }
  el.textContent = msg;
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function formattaTel(v) {
  const p = v.trim().startsWith('+') ? '+' : '';
  const c = v.replace(/\D/g, '');
  if (!c) return v.trim();
  if (p) return '+' + c.replace(/^(\d{2})(\d{3})(\d{3})(\d+)$/, '$1 $2 $3 $4');
  return c.replace(/^(\d{3})(\d{3})(\d+)$/, '$1 $2 $3');
}

// ---------- disegno ----------
function mostra() {
  window.scrollTo(0, 0);
  $('nav').hidden = modo === 'fatto';
  if (modo === 'riepilogo') return mostraRiepilogo();
  if (modo === 'fatto') return;
  const st = cur();
  const pag = S.pagine[st.p];
  const d = domandaDi(st);
  const primaDellaPagina = st.q <= 0;
  $('barra').style.width = Math.round(100 * (st.p + (st.q > 0 ? st.q / pag.domande.length : 0)) / S.pagine.length) + '%';

  let h = '';
  if (primaDellaPagina && st.p > 0 && (pag.titolo || pag.descr)) {
    h += '<div class="card">' + (pag.titolo ? '<div class="sez">' + esc(pag.titolo) + '</div>' : '') +
         (pag.descr ? '<p class="descr' + (pag.descr.length > 200 ? ' box' : '') + '">' + linkify(pag.descr) + '</p>' : '') + '</div>';
  }
  if (st.p === 0 && primaDellaPagina && pag.descr) h += '<div class="card"><p class="descr">' + linkify(pag.descr) + '</p></div>';
  if (d) h += '<div class="card">' + disegnaDomanda(d) + '</div>';
  $('main').innerHTML = h || '<div class="card"></div>';

  $('indietro').disabled = storia.length <= 1;
  $('avanti').textContent = (d && !d.obbl && vuota(d) && d.tipo !== 'info') ? 'Salta' : 'Avanti';
  if (d) collega(d);
}

function disegnaDomanda(d) {
  let h = '<h2>' + esc(d.titolo) + (d.obbl ? ' <span class="obbl">*</span>' : '') + '</h2>';
  if (d.aiuto) h += '<p class="aiuto">' + linkify(d.aiuto) + '</p>';
  const v = risposte[d.id];
  switch (d.tipo) {
    case 'info': return h;
    case 'testo':
      if (isTel(d)) return h + '<input id="campo" type="tel" inputmode="tel" autocomplete="tel" value="' + esc(v || '') + '">';
      if (isEmail(d)) return h + '<input id="campo" type="email" inputmode="email" autocomplete="email" value="' + esc(v || '') + '">';
      if (isAnno(d)) return h + '<input id="campo" type="text" inputmode="numeric" maxlength="4" value="' + esc(v || '') + '">';
      return h + '<input id="campo" type="text" autocomplete="off" value="' + esc(v || '') + '">';
    case 'paragrafo':
      return h + '<textarea id="campo">' + esc(v || '') + '</textarea>';
    case 'scelta': {
      const altroTesto = risposte[d.id + '_altro'] || '';
      const isAltro = v === '__altro__' || (v && d.altro && !d.scelte.some(c => c.v === v));
      h += d.scelte.map((c, i) => '<button type="button" class="opz' + (v === c.v ? ' sel' : '') + '" data-i="' + i + '">' +
           (v === c.v ? '<span class="tick">✓</span>' : '') + esc(c.v) + '</button>').join('');
      if (d.altro) h += '<button type="button" class="opz' + (isAltro ? ' sel' : '') + '" data-altro="1">Altro…</button>' +
           '<input id="altro" type="text" placeholder="Scrivi qui" value="' + esc(isAltro && v !== '__altro__' ? v : altroTesto) + '"' + (isAltro ? '' : ' hidden') + '>';
      return h;
    }
    case 'spunte': {
      const sel = Array.isArray(v) ? v : [];
      return h + d.scelte.map((c, i) => '<button type="button" class="opz' + (sel.includes(c.v) ? ' sel' : '') + '" data-i="' + i + '">' +
             (sel.includes(c.v) ? '<span class="tick">✓</span>' : '☐ ') + esc(c.v) + '</button>').join('');
    }
    case 'griglia': {
      const g = v || {};
      h += '<table class="griglia"><tr><th></th>' + d.colonne.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>';
      d.righe.forEach((r, ri) => {
        h += '<tr><td>' + esc(r) + '</td>' + d.colonne.map((c, ci) =>
          '<td><button type="button" class="chip' + ((g[r] || []).includes(c) ? ' sel' : '') + '" data-r="' + ri + '" data-c="' + ci + '">' +
          ((g[r] || []).includes(c) ? '✓' : '') + '</button></td>').join('') + '</tr>';
      });
      return h + '</table>';
    }
    default:
      return h + '<p class="aiuto">Questa domanda si può compilare solo nel modulo Google.</p>';
  }
}

function collega(d) {
  const campo = $('campo');
  if (campo) {
    campo.addEventListener('input', () => { risposte[d.id] = campo.value; aggiornaTasto(d); togliErrore(); });
    if (isTel(d)) campo.addEventListener('blur', () => { campo.value = formattaTel(campo.value); risposte[d.id] = campo.value; });
    if (campo.tagName === 'INPUT') campo.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); campo.blur(); avanti(); } });
    if (!('ontouchstart' in window)) campo.focus();
  }
  document.querySelectorAll('#main .opz[data-i]').forEach(b => b.addEventListener('click', () => {
    const c = d.scelte[Number(b.dataset.i)].v;
    if (d.tipo === 'spunte') {
      const sel = Array.isArray(risposte[d.id]) ? risposte[d.id].slice() : [];
      const k = sel.indexOf(c);
      if (k >= 0) sel.splice(k, 1); else sel.push(c);
      risposte[d.id] = sel;
      mostra();
      return;
    }
    if (inAttesa) return;
    risposte[d.id] = c;
    mostra();
    inAttesa = true;                                       // scelta singola: si passa da soli alla domanda dopo
    setTimeout(() => { inAttesa = false; avanti(); }, 220);
  }));
  const bAltro = document.querySelector('#main .opz[data-altro]');
  if (bAltro) {
    const inp = $('altro');
    bAltro.addEventListener('click', () => {
      risposte[d.id] = inp.value.trim() || '__altro__';
      document.querySelectorAll('#main .opz').forEach(x => x.classList.remove('sel'));
      bAltro.classList.add('sel'); inp.hidden = false; inp.focus();
    });
    inp.addEventListener('input', () => { risposte[d.id] = inp.value.trim() || '__altro__'; risposte[d.id + '_altro'] = inp.value; togliErrore(); });
  }
  document.querySelectorAll('#main .chip').forEach(b => b.addEventListener('click', () => {
    const r = d.righe[Number(b.dataset.r)], c = d.colonne[Number(b.dataset.c)];
    const g = Object.assign({}, risposte[d.id] || {});
    const sel = (g[r] || []).slice();
    const k = sel.indexOf(c);
    if (k >= 0) sel.splice(k, 1); else sel.push(c);
    g[r] = sel; risposte[d.id] = g;
    b.classList.toggle('sel'); b.textContent = k >= 0 ? '' : '✓';
    aggiornaTasto(d);
  }));
}

function aggiornaTasto(d) { $('avanti').textContent = (!d.obbl && vuota(d)) ? 'Salta' : 'Avanti'; }
function togliErrore() { const e = document.querySelector('.err'); if (e) e.remove(); }

// ---------- riepilogo e invio ----------
function testoRisposta(d) {
  const v = risposte[d.id];
  if (d.tipo === 'griglia') return Object.entries(v || {}).filter(([, a]) => a && a.length).map(([r, a]) => r + ': ' + a.join(', ').toLowerCase()).join('\n');
  if (Array.isArray(v)) return v.join(', ');
  return v;
}

function domandeDelPercorso() {
  const viste = [];
  storia.forEach((st, i) => {
    const d = domandaDi(st);
    if (d && d.tipo !== 'info' && d.tipo !== 'non_gestito') viste.push({ d, i });
  });
  return viste;
}

function mostraRiepilogo() {
  $('barra').style.width = '100%';
  let h = '<div class="card"><h2>Controlla prima di inviare</h2><dl class="riep">';
  domandeDelPercorso().forEach(({ d, i }) => {
    if (vuota(d) || d.tipo === 'spunte' && d.scelte.length === 1) return;
    h += '<dt>' + esc(d.titolo) + '</dt><dd>' + esc(testoRisposta(d)) + '<a href="#" data-i="' + i + '">correggi</a></dd>';
  });
  h += '</dl></div>';
  $('main').innerHTML = h;
  document.querySelectorAll('.riep a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    storia = storia.slice(0, Number(a.dataset.i) + 1);
    modo = 'domanda'; mostra();
  }));
  $('indietro').disabled = false;
  $('avanti').textContent = 'Invia la richiesta';
}

async function invia() {
  const b = $('avanti');
  b.disabled = true; b.textContent = 'Invio in corso…';
  const elenco = domandeDelPercorso()
    .filter(({ d }) => !vuota(d))
    .map(({ d }) => ({ id: d.id, valore: risposte[d.id] }));
  try {
    const r = await fetch(API, {
      method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ risposte: elenco, ms: Date.now() - inizio, sito: $('sito').value })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.errore || 'errore');
    const nome = S.pagine.flatMap(p => p.domande);
    const cogn = nome.find(d => /^cognome/i.test(d.titolo)), nm = nome.find(d => /^nome/i.test(d.titolo));
    ultimaPersona = [cogn && risposte[cogn.id], nm && risposte[nm.id]].filter(Boolean).join(' ');
    modo = 'fatto';
    mostraFatto();
  } catch (e) {
    b.disabled = false; b.textContent = 'Invia la richiesta';
    const cambiato = String(e.message).indexOf('MODULO_CAMBIATO') >= 0;
    mostraErrore(cambiato
      ? 'Il modulo è stato aggiornato proprio ora. Ricarica la pagina e compila di nuovo, per favore.'
      : 'Invio non riuscito. Controlla la connessione e riprova. Se non funziona, usa il modulo Google (link in fondo).');
  }
}

function mostraFatto() {
  $('nav').hidden = true;
  $('barra').style.width = '100%';
  $('main').innerHTML = '<div class="card fatto"><div class="ico">✓</div><h2>Richiesta ricevuta</h2>' +
    '<p class="descr">' + linkify(S.conferma || 'Ti telefoniamo noi per fissare giorno e ora.').replace(/Se devi prenotare[^]*$/, '') + '</p></div>' +
    '<button class="opz" id="altraPersona">➕ Prenota anche per un\'altra persona<br><span class="aiuto">Telefono e giorni restano compilati</span></button>' +
    '<button class="opz" id="fine">Ho finito</button>';
  $('altraPersona').addEventListener('click', altraPersona);
  $('fine').addEventListener('click', () => {
    $('main').innerHTML = '<div class="card fatto"><h2>Grazie, a presto.</h2><p class="aiuto">Puoi chiudere questa pagina.</p></div>';
  });
}

function altraPersona() {
  const tutte = S.pagine.flatMap(p => p.domande);
  const tieni = {};
  tutte.forEach(d => {
    if (d.tipo === 'spunte' && d.scelte.length === 1 && risposte[d.id]) tieni[d.id] = risposte[d.id];  // consenso
    if (isTel(d) || isEmail(d) || d.tipo === 'griglia') { if (risposte[d.id]) tieni[d.id] = risposte[d.id]; }
  });
  const insieme = tutte.find(d => /insieme/i.test(d.titolo));
  if (insieme && ultimaPersona) {
    const prima = risposte[insieme.id] ? String(risposte[insieme.id]) + ', ' : '';
    tieni[insieme.id] = prima.indexOf(ultimaPersona) >= 0 ? risposte[insieme.id] : prima + ultimaPersona;
  }
  risposte = tieni;
  nuovaScheda();
}

$('avanti').addEventListener('click', () => modo === 'riepilogo' ? invia() : avanti());
$('indietro').addEventListener('click', indietro);
carica();
</script>
